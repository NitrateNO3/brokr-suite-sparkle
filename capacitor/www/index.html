<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BrokrSuite</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1220;
        color: #f3f5f9;
        font-family:
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          sans-serif;
        text-align: center;
        padding: 24px;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 16px;
        background: linear-gradient(135deg, #c8a45c, #8c6d31);
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 22px;
        color: #0b1220;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        margin: 0;
        color: #9aa5b8;
        font-size: 14px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">B</div>
      <h1>BrokrSuite is offline</h1>
      <p>We couldn't reach the network. Reconnect and reopen the app — your saved drafts sync automatically.</p>
    </main>
  </body>
</html>
